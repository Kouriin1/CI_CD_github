name: saludo
env:
  GLOBAL_DATA: "dato global"

# 1. Evento que dispara el flujo
on:
  push:
    branches:
      - main 
      - develop

# 2. Definición de trabajos
jobs:
  saludar-job:
    runs-on: ubuntu-latest

    # 3. Los pasos van DENTRO del job
    steps:
      - name: mostrar saludo
        run: echo "hola desde github actions"
        
      - name: mostrar perfil
        env:
          USUARIO_ACTUAL: ${{ github.actor }}
        run: |
          echo "1 autor: $USUARIO_ACTUAL"
          echo "2 evento: ${{ github.event_name }}"
          echo "3 repo: ${{ github.repository }}"
          echo "4 ref: ${{ github.ref_name }}"
          echo "5 global: $GLOBAL_DATA"
          
      - name: condiciones 1
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "evento activado hacia main"
     
      - name: condiciones 2
        if: github.event_name == 'pull_request'
        run: echo "evento pull request activado"
        
      - name: se ejecuta cuando el paso anterior falla
        if: failure()
        run: echo "paso anterior fallo :("
        
      - name: se ejecuto bien siempre
        if: always()
        run: echo "se ejecuta siempre bien :)"
