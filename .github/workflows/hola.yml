name: saludo

# 1. Evento que dispara el flujo
on:
  push:
    branches:
      - main 
      - develop

# 2. Definición de trabajos
jobs:
  saludar-job:
    runs-on: ubuntu-latest

    # 3. Los pasos van DENTRO del job (alineados con "runs-on")
    steps:
      - name: mostrar saludo
        run: echo "hola desde github actions"
        
      - name: mostrar perfil
        run: |
          echo "autor: ${{ github.actor }}"
          echo " evento: ${{ github.event_name }}"
          echo " repo: ${{ github.repository }}"
          echo " ref: ${{ github.ref_name }}"

    
